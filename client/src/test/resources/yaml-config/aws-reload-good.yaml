version: 1.2.0
static:
  client:
    config_interval: 250
    max_connections_per_node: 99
    discovery:
      provider: aws-tags
      aws:
        region: us-east-1
        filters:
          - name: tag:aerospike-cluster
            values:
              - prod-a
        port: 3100
        init_timeout_ms: 200
        endpoint: http://127.0.0.1:1
dynamic:
  client:
    tend_interval: 250
    timeout: 2002
