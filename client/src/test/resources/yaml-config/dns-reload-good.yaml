version: 1.2.0
static:
  client:
    config_interval: 250
    max_connections_per_node: 99
    discovery:
      provider: dns
      dns:
        names:
          - seeds.example.com
        port: 3100
        servers:
          - 127.0.0.1:1
dynamic:
  client:
    tend_interval: 250
    timeout: 2002
