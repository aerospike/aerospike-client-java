version: 1.2.0
static:
  client:
    max_connections_per_node: 99
    ip_map:
      10.0.0.1: 192.168.1.1
      10.0.0.2: 192.168.1.2
    use_services_alternate: true
    discovery:
      provider: static
      merge_policy: replace
      refresh_interval_ms: 60000
      tend_refresh_deadline_ms: 200
    translation:
      provider: static-map
      on_miss: strict
