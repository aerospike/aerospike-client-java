name: Build and est
description: "Build and test code base"

inputs:
  crypto-type:
    description: "Crypto type to use. This should either be bouncycastle or gnu"
    required: false
    default: gnu
  server-tag:
    required: false
    default: "latest"
    description: "Server docker image tag"
  oidc-provider:
    required: true
    description: "OIDC provider"
  oidc-audience:
    required: true
    description: "OIDC audience"
  run-tests:
    required: true
    default: "true"
    description: Spin up aerospike enterprise server and run tests
  run-examples:
    required: false
    default: "true"
    description: Run examples suite against Aerospike
  server-container-repo:
    required: true
    description: Server type `aerospike-server` or `aerospike-enterprise-server`
  enable-tls:
    required: false
    default: "false"
    description: Enable TLS for the Aerospike server and test connections

runs:
  using: "composite"
  steps:
    # Using script to set profile since we would like to have the sticky effect. Set it once and have it
    # remain for remainder of the job
    - name: Stage crypto
      shell: bash
      run: |
        ./set_crypto ${{ inputs.crypto-type }}

    # Running build install
    - name: Build
      shell: bash
      run: mvn clean install

    # Starting test bench
    - name: Run Aerospike
      if: ${{ inputs.run-tests == 'true' || inputs.run-examples == 'true' }}
      id: setup-aerospike-server
      uses: aerospike/shared-workflows/.github/actions/setup-aerospike-server@334ad55b790658d549747b0d154407dfc730acca # latest main
      with:
        server-tag: ${{ inputs.server-tag }}
        server-container-repo: ${{ inputs.server-container-repo }}
        oidc-provider: ${{ inputs.oidc-provider }}
        oidc-audience: ${{ inputs.oidc-audience }}
        enable-tls: ${{ inputs.enable-tls }}

    - name: Import CA cert into JVM trust store
      if: ${{ (inputs.run-tests == 'true' || inputs.run-examples == 'true') && inputs.enable-tls == 'true' }}
      shell: bash
      run: |
        keytool -import -trustcacerts \
          -keystore $JAVA_HOME/lib/security/cacerts \
          -storepass changeit -noprompt \
          -alias aerospike-ca \
          -file ${{ steps.setup-aerospike-server.outputs.tls-cert-dir }}/ca.crt

    # Running tests
    - name: Run tests
      shell: bash
      if: ${{ inputs.run-tests == 'true' }}
      working-directory: test
      run: |
        if [ "${{ inputs.enable-tls }}" = "true" ]; then
          mvn test -DskipTests=false "-Dargs=-tls -h 127.0.0.1:aerospike-tls:4333 -p 4333"
        else
          mvn test -DskipTests=false
        fi

    - name: Run examples
      shell: bash
      if: ${{ inputs.run-examples == 'true' }}
      working-directory: examples
      run: |
        if [ "${{ inputs.enable-tls }}" = "true" ]; then
          java -jar target/aerospike-examples-*-jar-with-dependencies.jar \
            -h 127.0.0.1:aerospike-tls:4333 \
            -p 4333 \
            -tls \
            --report target/example-reports/TEST-examples.xml \
            all
        else
          java -jar target/aerospike-examples-*-jar-with-dependencies.jar \
            -h 127.0.0.1 \
            -p 3000 \
            --report target/example-reports/TEST-examples.xml \
            all
        fi
