# L2 community cluster. No access-address: nodes advertise container IPs,
# which the client must not be able to route. The server action inserts
# mesh seeds into the heartbeat block.
service {
    cluster-name docker
    proto-fd-max 15000
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any
        port 3000
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
}

namespace test {
    replication-factor 2
    storage-engine memory {
        data-size 1G
    }
}
