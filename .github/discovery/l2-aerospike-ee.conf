# L2 enterprise cluster. setup-aerospike-server injects feature-key-file
# from features-content. TLS name matches the certificate CN that action
# generates. No access-address and no alternate-access-address.
service {
    cluster-name docker
    proto-fd-max 15000
}

logging {
    console {
        context any info
    }
}

network {
    tls aerospike-tls {
        cert-file /etc/aerospike/tls/server.crt
        key-file /etc/aerospike/tls/server.key
        ca-file /etc/aerospike/tls/ca.crt
    }
    service {
        address any
        port 3000
        tls-port 4333
        tls-authenticate-client false
        tls-name aerospike-tls
    }
    heartbeat {
        mode mesh
        address any
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        address any
        port 3001
    }
}

namespace test {
    replication-factor 2
    storage-engine memory {
        data-size 1G
    }
}
