name: PR open

permissions:
  # This is required for requesting the OIDC token
  id-token: write
  checks: write
  pull-requests: write

on:
  pull_request:
    branches:
      - stage
      - stage-jdk8
      - dev/*
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      source-branch:
        type: string
        description: Base branch to use if manually starting. By default base_ref will empty if triggering manually hence base_ref is only available on PRs.

jobs:
  make-matrix:
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    outputs:
      input-matrix: ${{ steps.create-server-matrix.outputs.input-matrix }}
      java-version: ${{ steps.get-java-version.outputs.java-version }}
    steps:
      - uses: actions/checkout@v4       # brings versions.json into the workspace
        with:
          ref: ${{ github.ref }}

      - id: create-server-matrix
        uses: ./.github/actions/make-server-matrix
        with:
          default_json: ${{ vars.DEFAULT_SERVER_VERSIONS }}
          test_servers_file_path: ${{ vars.TEST_SERVERS_FILE_PATH }}

      - name: Get java version
        id: get-java-version
        run: |
          echo java-version="$(grep '<java.version>' pom.xml | sed -e 's/<[^>]*>//g' | awk '{$1=$1};1' | sed 's/^1\.8$/8/')"  >> $GITHUB_OUTPUT

      - name: debug - print input variables
        run: |
          echo ${{ steps.get-java-version.outputs.java-version }}
          echo ${{ steps.create-server-matrix.outputs.input-matrix }}

  # CLIENT-5539: prove the L2 client runs in maven:3-eclipse-temurin-21 with a
  # warmed ~/.m2, and that surefire XML lands on the host bind-mount so the
  # existing EnricoMi publisher can consume it. Isolation itself is E4/E6.
  l2-client-runner:
    name: L2 Java client runner
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    permissions:
      contents: read
      actions: write
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup L2 Java client runner
        id: runner
        uses: ./.github/actions/setup-l2-client-runner
        # Do not pass -o: skipTests install does not download Surefire's JUnit
        # provider; the first test run still needs the network for that jar.
        with:
          client-command: >
            mvn -B -pl test -DskipTests=false
            -DrunSuite='**/TestErrorDetailParser.class' test

      - name: Show L2 client runner outputs
        run: |
          echo "client-image=${{ steps.runner.outputs.client-image }}"
          echo "client-volumes=${{ steps.runner.outputs.client-volumes }}"
          echo "client-workdir=${{ steps.runner.outputs.client-workdir }}"

      - name: Confirm surefire reports landed on the host
        if: ${{ always() }}
        run: |
          set -euo pipefail
          ls -la test/target/surefire-reports/
          shopt -s nullglob
          reports=(test/target/surefire-reports/TEST-*.xml)
          if ((${#reports[@]} == 0)); then
            echo "Expected surefire XML under test/target/surefire-reports/" >&2
            exit 1
          fi
          printf 'Found surefire reports:\n'
          printf '  %s\n' "${reports[@]}"

      - name: Publish Test Results
        if: ${{ always() && hashFiles('test/target/surefire-reports/TEST-*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test/target/surefire-reports/*.xml
          check_name: "L2 client runner (surefire bind-mount)"

  build:
    uses: ./.github/workflows/build-pr.yaml
    needs: make-matrix
    strategy:
      matrix: 
        include: ${{ fromJson(needs.make-matrix.outputs.input-matrix) }}
    name: build-${{ matrix.server }}-${{ matrix.version }}
    with:
      java-version: ${{ needs.make-matrix.outputs.java-version }}
      run-tests: true 
      run-examples: true
      server-tag: ${{ matrix.version }}
      server-container-repo: ${{ matrix.type }}
    secrets: inherit