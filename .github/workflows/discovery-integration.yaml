name: Discovery integration

# CLIENT-5540. Own workflow so it runs parallel to the pull-request build
# matrix. Serialising this into build-and-test would add the L2 runtime to
# every matrix cell.
#
# CE (community, 3 nodes, no feature key) runs on every pull request.
# EE (enterprise, 3 nodes, TLS rows such as N-6) runs on same-repo pull
# requests, on push to the target branches (merge), and on workflow_dispatch.
# Fork pull requests do not receive FEATURES_CONF.
#
# TLS certificate matching (CLIENT-5638) is a separate EE-only job. Its
# driver starts one Enterprise container per certificate, so it uses the
# same FEATURES_CONF gate and does not run on fork pull requests.
#
# setup-aerospike-server and setup-discovery-topology are pinned in
# discovery-l2.yaml to shared-workflows commits that generate the TLS
# multi-node config (#335), so this workflow does not supply aerospike.conf.
# v5.0.0 does not have publish-ports, which this topology requires.

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write
  actions: write

on:
  pull_request:
    branches:
      - stage
      - stage-jdk8
      - dev/*
      - pluggable-discovery
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - stage
      - stage-jdk8
      - pluggable-discovery
  workflow_dispatch:

jobs:
  # The only place the enterprise gate is decided, so a skip and its report cannot drift apart.
  gate:
    name: Skipped layers
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-24.04' }}
    outputs:
      enterprise: ${{ steps.gate.outputs.enterprise }}
    steps:
      - name: Decide the enterprise gate
        id: gate
        env:
          ENTERPRISE: >-
            ${{
              github.event_name == 'push'
              || github.event_name == 'workflow_dispatch'
              || github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: |
          set -euo pipefail
          layers='[]'
          if [[ "${ENTERPRISE}" != true ]]; then
            reason='fork pull requests get no FEATURES_CONF'
            layers=$(jq -cn --arg reason "${reason}" '[
              {layer: "L2 EE", tests: "ee and ee cn-only profiles", reason: $reason},
              {layer: "TLS certificate matching", tests: "certificate name matching against Enterprise servers", reason: $reason}
            ]')
          fi
          echo "enterprise=${ENTERPRISE}" >> "${GITHUB_OUTPUT}"
          echo "layers=${layers}" >> "${GITHUB_OUTPUT}"

      - name: Report skipped layers
        uses: aerospike/aerospike-client-conformance/.github/actions/report-skipped-layers@f66304f36d1cded608e4d6c199622266e2db1dc3 # main
        with:
          layers: ${{ steps.gate.outputs.layers }}

  # A job if is evaluated before the matrix, so the fork gate cannot live on a
  # matrix cell. Community and enterprise stay two jobs.
  l2-ce:
    name: L2 discovery (ce${{ matrix.profile != 'default' && format(', {0}', matrix.profile) || '' }})
    strategy:
      fail-fast: false
      matrix:
        profile:
          - default
          - reachable
          - pass-through-names
          - pass-through-ports
          - port-map-range
          - low-mtu
          - port-range
          - idle-reset
    uses: ./.github/workflows/discovery-l2.yaml
    with:
      subset: ce
      server-container-repo: database-docker-virtual/aerospike-server
      server-tag: latest
      profile: ${{ matrix.profile }}
    secrets: inherit

  l2-ee:
    name: L2 discovery (ee${{ matrix.profile != 'default' && format(', {0}', matrix.profile) || '' }})
    needs: gate
    if: needs.gate.outputs.enterprise == 'true'
    strategy:
      fail-fast: false
      matrix:
        profile:
          - default
          - cn-only
    uses: ./.github/workflows/discovery-l2.yaml
    with:
      subset: ee
      server-container-repo: database-docker-dev-local/aerospike-server-enterprise
      server-tag: 8.2.0.0
      tls-listen-port-base: "43331"
      profile: ${{ matrix.profile }}
    secrets: inherit

  tls-matching:
    name: TLS certificate matching
    needs: gate
    if: needs.gate.outputs.enterprise == 'true'
    uses: ./.github/workflows/tls-matching.yaml
    with:
      server-container-repo: database-docker-dev-local/aerospike-server-enterprise
      server-tag: 8.2.0.0
    secrets: inherit
