name: Discovery integration

# CLIENT-5540. Own workflow so it runs parallel to the pull-request build
# matrix. The L2 tests run in discovery-l2-proxy.yaml.
#
# TLS certificate matching is an EE-only job. Its conformance test
# environment starts one Enterprise server per certificate, so it runs on
# same-repo pull requests, on push to the target branches (merge), and on
# workflow_dispatch. Fork pull requests do not receive FEATURES_CONF.
#
# The aws-tags and dns provider suites (discovery-providers.yaml) run against
# conformance test environments with a two node Enterprise cluster each, behind
# the same gate. The translation suites (discovery-translation.yaml) run against Community
# conformance test environments, so they run on every pull request.

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write
  actions: write

on:
  pull_request:
    branches:
      - stage
      - stage-jdk8
      - dev/*
      - pluggable-discovery
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - stage
      - stage-jdk8
      - pluggable-discovery
  workflow_dispatch:

jobs:
  # The only place this workflow decides the enterprise gate, so a skip and its report cannot drift apart.
  gate:
    name: Skipped layers
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    outputs:
      enterprise: ${{ steps.gate.outputs.enterprise }}
    steps:
      - name: Decide the enterprise gate
        id: gate
        env:
          ENTERPRISE: >-
            ${{
              github.event_name == 'push'
              || github.event_name == 'workflow_dispatch'
              || github.event.pull_request.head.repo.full_name == github.repository
            }}
        run: |
          set -euo pipefail
          layers='[]'
          if [[ "${ENTERPRISE}" != true ]]; then
            reason='fork pull requests get no FEATURES_CONF'
            layers=$(jq -cn --arg reason "${reason}" '[
              {layer: "TLS certificate matching", tests: "certificate name matching against Enterprise servers", reason: $reason},
              {layer: "Discovery providers", tests: "SuiteAwsTags and SuiteDnsDiscovery", reason: $reason}
            ]')
          fi
          echo "enterprise=${ENTERPRISE}" >> "${GITHUB_OUTPUT}"
          echo "layers=${layers}" >> "${GITHUB_OUTPUT}"

      - name: Report skipped layers
        uses: aerospike/aerospike-client-conformance/.github/actions/report-skipped-layers@a30c0787dede434f15be3622e7007dc57b55209d # main
        with:
          layers: ${{ steps.gate.outputs.layers }}

  tls-matching:
    name: TLS certificate matching
    needs: gate
    if: needs.gate.outputs.enterprise == 'true'
    uses: ./.github/workflows/tls-matching.yaml
    with:
      server-tag: 8.2.0.0
    secrets: inherit

  providers:
    name: Discovery providers
    needs: gate
    if: needs.gate.outputs.enterprise == 'true'
    uses: ./.github/workflows/discovery-providers.yaml
    with:
      server-tag: 8.2.0.0
    secrets: inherit

  translation:
    name: Translation
    uses: ./.github/workflows/discovery-translation.yaml
    with:
      server-tag: 8.2.0.1
