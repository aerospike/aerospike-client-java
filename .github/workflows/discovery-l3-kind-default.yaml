name: Discovery L3 kind (default)

# Runs the default profile of l3-kind in aerospike-client-conformance against this
# commit through the L5 driver. Each l3-kind profile has its own workflow
# because l3-kind.yaml names its results artifact after the run alone. The
# job needs the Enterprise feature key (FEATURES_CONF), so it fails on fork
# pull requests.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - pluggable-discovery
      - stage
      - stage-jdk8
  workflow_dispatch:

jobs:
  l3-kind:
    name: L3 kind (default)
    uses: aerospike/aerospike-client-conformance/.github/workflows/l3-kind.yaml@b2ef70c8fbc5896b6d34e02d92e99621b0411254 # main
    with:
      client-repository: ${{ github.repository }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: test/discovery/l5-aws.manifest
      profile: default
      ako-version: 4.7.0
      conformance-ref: b2ef70c8fbc5896b6d34e02d92e99621b0411254
    secrets:
      FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
