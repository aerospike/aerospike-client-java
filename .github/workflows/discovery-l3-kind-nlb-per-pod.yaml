name: Discovery L3 kind (nlb-per-pod)

# Runs the nlb-per-pod profile of l3-kind in aerospike-client-conformance against this
# commit through the L5 driver. Each l3-kind profile has its own workflow
# because l3-kind.yaml names its results artifact after the run alone. The
# job needs the Enterprise feature key (FEATURES_CONF), so it fails on fork
# pull requests.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - pluggable-discovery
      - stage
      - stage-jdk8
  workflow_dispatch:

jobs:
  l3-kind:
    name: L3 kind (nlb-per-pod)
    uses: aerospike/aerospike-client-conformance/.github/workflows/l3-kind.yaml@51510577c2e935c2dfb78d695a1ebd1fed1f8ef4 # main
    with:
      client-repository: ${{ github.repository }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: test/discovery/l5-aws.manifest
      profile: nlb-per-pod
      ako-version: 4.8.0-dev1
      ako-helm-repo: https://aerospike.github.io/aerospike-kubernetes-operator
      cluster-chart-version: 4.7.0
      conformance-ref: 51510577c2e935c2dfb78d695a1ebd1fed1f8ef4
    secrets:
      FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
