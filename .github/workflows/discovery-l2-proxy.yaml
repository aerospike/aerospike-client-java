name: Discovery L2 proxy

# Runs every l2-proxy profile of aerospike-client-conformance against this
# commit through the L5 driver, then the Java L2 tests of each profile through
# test/discovery/l2_run.sh, the manifest's L2_RUN. The Java tests that need a
# DNS server, start nodes or use TLS stay in discovery-integration.yaml.
# Community edition, so it needs no feature key and runs on fork pull requests.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - stage
      - stage-jdk8
      - dev/*
      - pluggable-discovery
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - stage
      - stage-jdk8
      - pluggable-discovery
  workflow_dispatch:

jobs:
  l2-proxy:
    name: L2 proxy
    uses: aerospike/aerospike-client-conformance/.github/workflows/l2-proxy.yaml@f0dfda5d49e0fcac2613df3fa29e4386201df11c # main
    with:
      client-repository: ${{ github.repository }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      manifest: test/discovery/l5-aws.manifest
      profile: all
      edition: ce
      conformance-ref: f0dfda5d49e0fcac2613df3fa29e4386201df11c
