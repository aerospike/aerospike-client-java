run-name: Build artifact for ${{ github.event.pull_request.head.ref }} - ${{ github.event.number }} 

on:
  workflow_call:
    inputs:
      server-container-repo:
        type: string
        required: true
      java-version:
        type: string
        required: true
      server-tag:
        type: string
        required: false
        default: "latest"
        description: "Server docker image tag"
      run-tests:
        type: boolean
        required: false
        default: false
        description: Spin up aerospike enterprise server and run tests
      run-examples:
        type: boolean
        required: false
        default: false
        description: Run examples suite against Aerospike server

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    strategy:
      matrix:
        crypto: [bouncycastle, gnu]
    name: build-${{ matrix.crypto }}-${{ inputs.server-tag }}-${{ inputs.java-version }}
    with:
      java-version: ${{ inputs.java-version }}
      run-tests: ${{ inputs.run-tests }}
      run-examples: false
      server-tag: ${{ inputs.server-tag }}
      crypto-type:  ${{ matrix.crypto }}
      server-container-repo: ${{ inputs.server-container-repo }}
    secrets: inherit

  examples:
    uses: ./.github/workflows/build.yaml
    name: examples-gnu-${{ inputs.server-tag }}-${{ inputs.java-version }}
    with:
      java-version: ${{ inputs.java-version }}
      run-tests: false
      run-examples: ${{ inputs.run-examples }}
      server-tag: ${{ inputs.server-tag }}
      crypto-type: gnu
      server-container-repo: ${{ inputs.server-container-repo }}
    secrets: inherit
