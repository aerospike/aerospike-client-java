run-name: Build artifact for ${{ github.event.pull_request.head.ref }} - ${{ github.event.number }} 

on:
  workflow_call:
    inputs:
      java-version:
        type: string
        required: true
      server-tag:
        type: string
        required: false
        default: "latest"
        description: "Server docker image tag"
      crypto-type:
        type: string
        required: true
      run-tests:
        type: boolean
        required: false
        default: false
        description: Spin up aerospike enterprise server and run tests

jobs:
  build:
    uses: ./.github/workflows/build.yaml
    strategy:
      matrix:
        crypto-type: ${{ fromJson(inputs.crypto-type )}}
    name: build-${{ matrix.crypto-type }}-${{ inputs.server-tag }}-${{ inputs.java-version }}
    with:
      java-version: ${{ inputs.java-version }}
      run-tests: ${{ inputs.run-tests }}
      server-tag: ${{ inputs.server-tag }}
      crypto-type: ${{ matrix.crypto-type }}
    secrets: inherit
