name: TLS certificate matching

# Runs SuiteTlsMatching once per case, each case in its own JVM, and TestTlsProxy against the
# aerospike-client-conformance tls-matching test environment (envs/tls-matching.sh).

on:
  workflow_call:
    inputs:
      server-container-repo:
        description: Aerospike Enterprise image repository path
        type: string
        required: true
      server-tag:
        description: Aerospike Enterprise image tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  tls-matching:
    name: cases
    uses: aerospike/aerospike-client-conformance/.github/workflows/test-envs.yaml@57c0a2ae457f77a56bdae2675688f66218e8fa89 # main
    with:
      environment: tls-matching
      conformance-ref: 57c0a2ae457f77a56bdae2675688f66218e8fa89
      server-image: aerospike/aerospike-server-enterprise:${{ inputs.server-tag }}
      command: |
        set -uo pipefail
        export JAVA_HOME="$JAVA_HOME_21_X64"
        mvn -B -pl client -am install -DskipTests || exit 1
        failed=()
        for c in ${TLS_CASES//,/ }; do
          if ! { TLS_CASE="$c" mvn -B -pl test test -DskipTests=false -DrunSuite='**/SuiteTlsMatching.class' &&
            bash .github/discovery/check-skips.sh test/target/surefire-reports; }; then
            failed+=("$c")
          fi
        done
        if ! { mvn -B -pl test test -DskipTests=false -Dtest=TestTlsProxy -DfailIfNoTests=false &&
          bash .github/discovery/check-skips.sh test/target/surefire-reports; }; then
          failed+=(TestTlsProxy)
        fi
        if [ ${#failed[@]} -gt 0 ]; then
          echo "::error::failed: ${failed[*]}"
          exit 1
        fi
    secrets:
      features-conf: ${{ secrets.FEATURES_CONF }}
