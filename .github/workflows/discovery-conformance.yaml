name: Discovery conformance

# L0: run the client unit tests. L1: run the aerospike-client-conformance fixture set through ConformanceTest.

permissions:
  contents: read

on:
  pull_request:
    branches:
      - stage
      - stage-jdk8
      - dev/*
      - pluggable-discovery
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - stage
      - stage-jdk8
      - pluggable-discovery
  workflow_dispatch:

jobs:
  l0:
    name: L0 client unit tests
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: ${{ vars.JAVA_PROVIDER || 'semeru' }}
          java-version: "21"

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: m2-unit-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-unit-

      - name: Run client unit tests
        run: mvn -B -pl client -am test

  l1:
    name: L1 conformance
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Checkout conformance fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: aerospike/aerospike-client-conformance
          ref: f66304f36d1cded608e4d6c199622266e2db1dc3 # main, fixture set 1.1.0
          path: conformance-fixtures

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: ${{ vars.JAVA_PROVIDER || 'semeru' }}
          java-version: "21"

      - name: Cache Maven repository
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: m2-conformance-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-conformance-

      - name: Run conformance fixtures
        env:
          FIXTURES_DIRECTORY: ${{ github.workspace }}/conformance-fixtures
        run: mvn -B -pl client -am test -Dtest=ConformanceTest "-Dconformance.dir=${FIXTURES_DIRECTORY}"

      - name: Upload conformance report
        if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: conformance-report-java
          path: client/target/conformance-report.json

      - name: Setup Python
        if: ${{ always() }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Collect conformance report
        if: ${{ always() }}
        uses: aerospike/aerospike-client-conformance/.github/actions/collect-conformance-report@f66304f36d1cded608e4d6c199622266e2db1dc3 # main
        with:
          reports-directory: client/target
          fixtures-directory: ${{ github.workspace }}/conformance-fixtures
          declarations-directory: client/src/test/resources/conformance
