name: Discovery k8s

# CLIENT-5542. Kind plus AKO takes 3-5 minutes, so L3 runs as its own job.
# The job needs the Enterprise feature key (FEATURES_CONF). Fork pull requests
# do not receive repository secrets, so on a fork pull request the job fails
# at the key check.
#
# The JVM runs on the runner. setup-kind-ako writes the endpoint hostname
# into the runner hosts file, aimed at the kind node.
#
# The l3-tls job builds the same cluster at two pods and runs
# enable-l3-tls.sh, which serves TLS from a secret with a certificate for the
# cluster tls-name, before the suite.
#
# l3 and l3-tls build the AerospikeCluster with alternateAccess configuredIP
# on AKO_VERSION_CONFIGURED_IP. The l3-nlb jobs build it with
# networkLoadBalancer on AKO_VERSION_NLB: l3-nlb with every pod on one node,
# l3-nlb-per-pod with one pod per kind worker, and l3-nlb-tls with a TLS
# alternate access address distinct from the clear one. They do not block
# while AKO_VERSION_NLB is a dev build. setup-kind-ako prints the AKO chart
# version it resolved in its install step.
#
# A schedule runs from the default branch. That run checks out stage. A push
# to pluggable-discovery, stage or stage-jdk8 checks out the pushed commit.

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
  push:
    branches:
      - pluggable-discovery
      - stage
      - stage-jdk8
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  AKO_VERSION_CONFIGURED_IP: 4.5.0
  # networkLoadBalancer alternate access first ships in AKO 4.8.0. Its dev
  # build ships no aerospike-cluster chart, so 4.7.0 renders the cluster, and
  # only the operator chart repository serves it.
  AKO_VERSION_NLB: 4.8.0-dev1
  CLUSTER_CHART_VERSION_NLB: 4.7.0
  AKO_HELM_REPO_NLB: https://aerospike.github.io/aerospike-kubernetes-operator

jobs:
  l3:
    name: L3 discovery (k8s)
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'stage' || github.sha }}

      - name: Get java version
        id: java
        run: |
          echo java-version="$(grep '<java.version>' pom.xml | sed -e 's/<[^>]*>//g' | awk '{$1=$1};1' | sed 's/^1\.8$/8/')" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ vars.JAVA_PROVIDER }}
          java-version: ${{ steps.java.outputs.java-version }}

      - name: Require the Enterprise feature key
        env:
          FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES_CONF}" ]]; then
            echo "::error::FEATURES_CONF is required to start the Enterprise cluster. L3 does not run on fork pull requests."
            exit 1
          fi

      - name: Setup kind and AKO
        id: kind-ako
        uses: aerospike/shared-workflows/.github/actions/setup-kind-ako@3ad1bc4b8c4ca7e5b7661aab5cd9151def0e763a
        with:
          features-content: ${{ secrets.FEATURES_CONF }}
          ako-version: ${{ env.AKO_VERSION_CONFIGURED_IP }}

      - name: Run K suite
        env:
          DISCOVERY_ENDPOINT_HOSTNAME: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          DISCOVERY_INGRESS_PORTS: ${{ steps.kind-ako.outputs.ingress-ports }}
          DISCOVERY_SERVICE_NODE_PORTS: ${{ steps.kind-ako.outputs.service-node-ports }}
          DISCOVERY_KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          AEROSPIKE_ADMIN_PASSWORD: ${{ steps.kind-ako.outputs.admin-password }}
        run: bash .github/discovery/run-l3-suite.sh

      - name: Publish Test Results
        if: ${{ always() && hashFiles('test/target/surefire-reports/TEST-*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test/target/surefire-reports/*.xml
          check_name: "L3 discovery (k8s)"

  l3-tls:
    name: L3 discovery (k8s, TLS)
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'stage' || github.sha }}

      - name: Get java version
        id: java
        run: |
          echo java-version="$(grep '<java.version>' pom.xml | sed -e 's/<[^>]*>//g' | awk '{$1=$1};1' | sed 's/^1\.8$/8/')" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ vars.JAVA_PROVIDER }}
          java-version: ${{ steps.java.outputs.java-version }}

      - name: Require the Enterprise feature key
        env:
          FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES_CONF}" ]]; then
            echo "::error::FEATURES_CONF is required to start the Enterprise cluster. L3 does not run on fork pull requests."
            exit 1
          fi

      - name: Setup kind and AKO
        id: kind-ako
        uses: aerospike/shared-workflows/.github/actions/setup-kind-ako@3ad1bc4b8c4ca7e5b7661aab5cd9151def0e763a
        with:
          features-content: ${{ secrets.FEATURES_CONF }}
          ako-version: ${{ env.AKO_VERSION_CONFIGURED_IP }}
          cluster-size: 2

      - name: Serve TLS on the AerospikeCluster
        id: tls
        env:
          KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
        run: bash .github/discovery/enable-l3-tls.sh

      - name: Run K suite
        env:
          DISCOVERY_ENDPOINT_HOSTNAME: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          DISCOVERY_INGRESS_PORTS: ${{ steps.kind-ako.outputs.ingress-ports }}
          DISCOVERY_SERVICE_NODE_PORTS: ${{ steps.kind-ako.outputs.service-node-ports }}
          DISCOVERY_KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          DISCOVERY_TLS_CA_FILE: ${{ steps.tls.outputs.ca-file }}
          DISCOVERY_TLS_NAME: ${{ steps.tls.outputs.tls-name }}
          L3_SUITE: '**/TestK8sTlsName.class'
          AEROSPIKE_ADMIN_PASSWORD: ${{ steps.kind-ako.outputs.admin-password }}
        run: bash .github/discovery/run-l3-suite.sh

      - name: Publish Test Results
        if: ${{ always() && hashFiles('test/target/surefire-reports/TEST-*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test/target/surefire-reports/*.xml
          check_name: "L3 discovery (k8s, TLS)"

  l3-nlb:
    name: L3 discovery (k8s, networkLoadBalancer)
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'stage' || github.sha }}

      - name: Get java version
        id: java
        run: |
          echo java-version="$(grep '<java.version>' pom.xml | sed -e 's/<[^>]*>//g' | awk '{$1=$1};1' | sed 's/^1\.8$/8/')" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ vars.JAVA_PROVIDER }}
          java-version: ${{ steps.java.outputs.java-version }}

      - name: Require the Enterprise feature key
        env:
          FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES_CONF}" ]]; then
            echo "::error::FEATURES_CONF is required to start the Enterprise cluster. L3 does not run on fork pull requests."
            exit 1
          fi

      - name: Setup kind and AKO
        id: kind-ako
        uses: aerospike/shared-workflows/.github/actions/setup-kind-ako@3ad1bc4b8c4ca7e5b7661aab5cd9151def0e763a
        with:
          features-content: ${{ secrets.FEATURES_CONF }}
          ako-version: ${{ env.AKO_VERSION_NLB }}
          ako-helm-repo: ${{ env.AKO_HELM_REPO_NLB }}
          cluster-chart-version: ${{ env.CLUSTER_CHART_VERSION_NLB }}
          alternate-access: networkLoadBalancer
          multi-pod-per-host: true

      - name: Run K suite
        env:
          DISCOVERY_ENDPOINT_HOSTNAME: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          DISCOVERY_INGRESS_PORTS: ${{ steps.kind-ako.outputs.ingress-ports }}
          DISCOVERY_SERVICE_NODE_PORTS: ${{ steps.kind-ako.outputs.service-node-ports }}
          DISCOVERY_KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          L3_REREGISTER_KIND_CLUSTER: kind-ako
          AEROSPIKE_ADMIN_PASSWORD: ${{ steps.kind-ako.outputs.admin-password }}
        run: bash .github/discovery/run-l3-suite.sh

      - name: Publish Test Results
        if: ${{ always() && hashFiles('test/target/surefire-reports/TEST-*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test/target/surefire-reports/*.xml
          check_name: "L3 discovery (k8s, networkLoadBalancer)"

  l3-nlb-per-pod:
    name: L3 discovery (k8s, networkLoadBalancer, one pod per node)
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'stage' || github.sha }}

      - name: Get java version
        id: java
        run: |
          echo java-version="$(grep '<java.version>' pom.xml | sed -e 's/<[^>]*>//g' | awk '{$1=$1};1' | sed 's/^1\.8$/8/')" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ vars.JAVA_PROVIDER }}
          java-version: ${{ steps.java.outputs.java-version }}

      - name: Require the Enterprise feature key
        env:
          FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES_CONF}" ]]; then
            echo "::error::FEATURES_CONF is required to start the Enterprise cluster. L3 does not run on fork pull requests."
            exit 1
          fi

      - name: Setup kind and AKO
        id: kind-ako
        uses: aerospike/shared-workflows/.github/actions/setup-kind-ako@3ad1bc4b8c4ca7e5b7661aab5cd9151def0e763a
        with:
          features-content: ${{ secrets.FEATURES_CONF }}
          ako-version: ${{ env.AKO_VERSION_NLB }}
          ako-helm-repo: ${{ env.AKO_HELM_REPO_NLB }}
          cluster-chart-version: ${{ env.CLUSTER_CHART_VERSION_NLB }}
          alternate-access: networkLoadBalancer
          multi-pod-per-host: false
          cluster-size: 2

      - name: Run K suite
        env:
          DISCOVERY_ENDPOINT_HOSTNAME: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          DISCOVERY_INGRESS_PORTS: ${{ steps.kind-ako.outputs.ingress-ports }}
          DISCOVERY_SERVICE_NODE_PORTS: ${{ steps.kind-ako.outputs.service-node-ports }}
          DISCOVERY_KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          L3_REREGISTER_KIND_CLUSTER: kind-ako
          AEROSPIKE_ADMIN_PASSWORD: ${{ steps.kind-ako.outputs.admin-password }}
        run: bash .github/discovery/run-l3-suite.sh

      - name: Publish Test Results
        if: ${{ always() && hashFiles('test/target/surefire-reports/TEST-*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test/target/surefire-reports/*.xml
          check_name: "L3 discovery (k8s, networkLoadBalancer, one pod per node)"

  l3-nlb-tls:
    name: L3 discovery (k8s, networkLoadBalancer, TLS)
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'schedule' && 'stage' || github.sha }}

      - name: Get java version
        id: java
        run: |
          echo java-version="$(grep '<java.version>' pom.xml | sed -e 's/<[^>]*>//g' | awk '{$1=$1};1' | sed 's/^1\.8$/8/')" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ vars.JAVA_PROVIDER }}
          java-version: ${{ steps.java.outputs.java-version }}

      - name: Require the Enterprise feature key
        env:
          FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES_CONF}" ]]; then
            echo "::error::FEATURES_CONF is required to start the Enterprise cluster. L3 does not run on fork pull requests."
            exit 1
          fi

      - name: Setup kind and AKO
        id: kind-ako
        uses: aerospike/shared-workflows/.github/actions/setup-kind-ako@3ad1bc4b8c4ca7e5b7661aab5cd9151def0e763a
        with:
          features-content: ${{ secrets.FEATURES_CONF }}
          ako-version: ${{ env.AKO_VERSION_NLB }}
          ako-helm-repo: ${{ env.AKO_HELM_REPO_NLB }}
          cluster-chart-version: ${{ env.CLUSTER_CHART_VERSION_NLB }}
          alternate-access: networkLoadBalancer
          multi-pod-per-host: true
          cluster-size: 2

      - name: Serve TLS on the AerospikeCluster
        id: tls
        env:
          KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          DISCOVERY_TLS_ENDPOINT_HOSTNAME: as-endpoint-tls.test
        run: bash .github/discovery/enable-l3-tls.sh

      - name: Run K suite
        env:
          DISCOVERY_ENDPOINT_HOSTNAME: ${{ steps.kind-ako.outputs.endpoint-hostname }}
          DISCOVERY_INGRESS_PORTS: ${{ steps.kind-ako.outputs.ingress-ports }}
          DISCOVERY_SERVICE_NODE_PORTS: ${{ steps.kind-ako.outputs.service-node-ports }}
          DISCOVERY_KUBECONFIG: ${{ steps.kind-ako.outputs.kubeconfig }}
          DISCOVERY_TLS_CA_FILE: ${{ steps.tls.outputs.ca-file }}
          DISCOVERY_TLS_NAME: ${{ steps.tls.outputs.tls-name }}
          DISCOVERY_TLS_ENDPOINT_HOSTNAME: ${{ steps.tls.outputs.tls-endpoint-hostname }}
          L3_SUITE: '**/TestK8sTlsName.class'
          L3_REREGISTER_KIND_CLUSTER: kind-ako
          AEROSPIKE_ADMIN_PASSWORD: ${{ steps.kind-ako.outputs.admin-password }}
        run: bash .github/discovery/run-l3-suite.sh

      - name: Publish Test Results
        if: ${{ always() && hashFiles('test/target/surefire-reports/TEST-*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test/target/surefire-reports/*.xml
          check_name: "L3 discovery (k8s, networkLoadBalancer, TLS)"
