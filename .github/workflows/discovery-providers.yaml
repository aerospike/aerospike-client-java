name: Discovery providers

# Runs SuiteAwsTags and SuiteDnsDiscovery, each against its aerospike-client-conformance test
# environment (envs/aws-tags.sh, envs/dns.sh), which starts a two node Enterprise cluster, so the
# jobs need FEATURES_CONF.
# The build runs on JDK 21 for --release 8 and the suites run on Java 8, the runtime this branch targets.

on:
  workflow_call:
    inputs:
      server-tag:
        description: Aerospike Enterprise image tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  aws-tags:
    name: aws-tags
    uses: aerospike/aerospike-client-conformance/.github/workflows/test-envs.yaml@42db5e9c508226cc0ad1496d7dff1cb23dac2bb0 # main
    with:
      environment: aws-tags
      conformance-ref: 42db5e9c508226cc0ad1496d7dff1cb23dac2bb0
      server-image: aerospike/aerospike-server-enterprise:${{ inputs.server-tag }}
      command: |
        set -euo pipefail
        export JAVA_HOME="$JAVA_HOME_21_X64"
        mvn -B -pl client -am install -DskipTests
        mvn -B -pl test test -Djvm="$JAVA_HOME_8_X64/bin/java" -DskipTests=false -DrunSuite='**/SuiteAwsTags.class'
        bash .github/discovery/check-skips.sh test/target/surefire-reports
    secrets:
      features-conf: ${{ secrets.FEATURES_CONF }}

  dns:
    name: dns
    uses: aerospike/aerospike-client-conformance/.github/workflows/test-envs.yaml@42db5e9c508226cc0ad1496d7dff1cb23dac2bb0 # main
    with:
      environment: dns
      conformance-ref: 42db5e9c508226cc0ad1496d7dff1cb23dac2bb0
      server-image: aerospike/aerospike-server-enterprise:${{ inputs.server-tag }}
      command: |
        set -euo pipefail
        export JAVA_HOME="$JAVA_HOME_21_X64"
        mvn -B -pl client -am install -DskipTests
        mvn -B -pl test test -Djvm="$JAVA_HOME_8_X64/bin/java" -DskipTests=false -DrunSuite='**/SuiteDnsDiscovery.class'
        bash .github/discovery/check-skips.sh test/target/surefire-reports
    secrets:
      features-conf: ${{ secrets.FEATURES_CONF }}
