name: Discovery providers

# Runs SuiteAwsTags (test/discovery/run_aws_tags.sh) and SuiteDnsDiscovery
# (test/discovery/run_dns.sh). Each driver starts its own two node Enterprise
# cluster in Docker, so the job needs FEATURES_CONF and the JFrog OIDC secrets
# to pull the Enterprise image.

on:
  workflow_call:
    inputs:
      server-container-repo:
        description: Aerospike Enterprise image repository path
        type: string
        required: true
      server-tag:
        description: Aerospike Enterprise image tag
        type: string
        required: true

permissions:
  id-token: write
  contents: read
  checks: write
  pull-requests: write

jobs:
  providers:
    name: aws-tags and dns
    runs-on: ${{ vars.BUILD_CONTAINER_DISTRO_VERSION }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Get Java version
        id: java
        run: |
          set -euo pipefail
          version="$(grep '<java.version>' pom.xml | sed -e 's/<[^>]*>//g' | awk '{$1=$1};1' | sed 's/^1\.8$/8/')"
          echo "java-version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ vars.JAVA_PROVIDER }}
          java-version: ${{ steps.java.outputs.java-version }}
          cache: maven

      - name: Require JFrog OIDC
        env:
          OIDC_PROVIDER: ${{ secrets.JFROG_OIDC_PROVIDER }}
          OIDC_AUDIENCE: ${{ secrets.JFROG_OIDC_AUDIENCE }}
        run: |
          set -euo pipefail
          if [[ -z "${OIDC_PROVIDER}" || -z "${OIDC_AUDIENCE}" ]]; then
            echo "::error::JFROG_OIDC_PROVIDER and JFROG_OIDC_AUDIENCE are required to pull the Aerospike image."
            exit 1
          fi

      - name: Set up JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@a6b41f8338bea0983ddff6bd4ede7d2dcd81e1fa # v4.8.1
        env:
          JF_URL: https://aerospike.jfrog.io
        with:
          oidc-provider-name: ${{ secrets.JFROG_OIDC_PROVIDER }}
          oidc-audience: ${{ secrets.JFROG_OIDC_AUDIENCE }}

      - name: Docker login
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: aerospike.jfrog.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Write the feature key
        id: features
        env:
          FEATURES_CONF: ${{ secrets.FEATURES_CONF }}
          AEROSPIKE_IMAGE: aerospike.jfrog.io/${{ inputs.server-container-repo }}:${{ inputs.server-tag }}
        run: |
          set -euo pipefail
          if [[ -z "${FEATURES_CONF}" ]]; then
            echo "::error::FEATURES_CONF is required to start the Enterprise cluster."
            exit 1
          fi
          file="${RUNNER_TEMP}/features.conf"
          printf '%s\n' "${FEATURES_CONF}" > "${file}"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
          docker pull "${AEROSPIKE_IMAGE}"

      - name: Run SuiteAwsTags
        env:
          AEROSPIKE_IMAGE: aerospike.jfrog.io/${{ inputs.server-container-repo }}:${{ inputs.server-tag }}
          AEROSPIKE_FEATURES_FILE: ${{ steps.features.outputs.file }}
          AWS_TAGS_MAVEN_OFFLINE: "0"
        run: bash test/discovery/run_aws_tags.sh

      - name: Run SuiteDnsDiscovery
        if: ${{ !cancelled() && steps.features.outcome == 'success' }}
        env:
          AEROSPIKE_IMAGE: aerospike.jfrog.io/${{ inputs.server-container-repo }}:${{ inputs.server-tag }}
          AEROSPIKE_FEATURES_FILE: ${{ steps.features.outputs.file }}
          DNS_SKIP_BUILD: "1"
          DNS_MAVEN_OFFLINE: "0"
        run: bash test/discovery/run_dns.sh

      - name: Publish Test Results
        if: ${{ always() && hashFiles('test/target/surefire-reports/TEST-*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          files: test/target/surefire-reports/*.xml
          check_name: "Discovery providers (aws-tags, dns)"
