name: Discovery providers

# Runs SuiteAwsTags and SuiteDnsDiscovery, each against its aerospike-client-conformance test
# environment (envs/aws-tags.sh, envs/dns.sh), which starts a two node Enterprise cluster, so the
# jobs need FEATURES_CONF.

on:
  workflow_call:
    inputs:
      server-tag:
        description: Aerospike Enterprise image tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  aws-tags:
    name: aws-tags
    uses: aerospike/aerospike-client-conformance/.github/workflows/test-envs.yaml@51510577c2e935c2dfb78d695a1ebd1fed1f8ef4 # main
    with:
      environment: aws-tags
      conformance-ref: 51510577c2e935c2dfb78d695a1ebd1fed1f8ef4
      server-image: aerospike/aerospike-server-enterprise:${{ inputs.server-tag }}
      command: |
        set -euo pipefail
        export JAVA_HOME="$JAVA_HOME_21_X64"
        mvn -B -pl client -am install -DskipTests
        mvn -B -pl test test -DskipTests=false -DrunSuite='**/SuiteAwsTags.class'
        bash .github/discovery/check-skips.sh test/target/surefire-reports
    secrets:
      features-conf: ${{ secrets.FEATURES_CONF }}

  dns:
    name: dns
    uses: aerospike/aerospike-client-conformance/.github/workflows/test-envs.yaml@51510577c2e935c2dfb78d695a1ebd1fed1f8ef4 # main
    with:
      environment: dns
      conformance-ref: 51510577c2e935c2dfb78d695a1ebd1fed1f8ef4
      server-image: aerospike/aerospike-server-enterprise:${{ inputs.server-tag }}
      command: |
        set -euo pipefail
        export JAVA_HOME="$JAVA_HOME_21_X64"
        mvn -B -pl client -am install -DskipTests
        mvn -B -pl test test -DskipTests=false -DrunSuite='**/SuiteDnsDiscovery.class'
        bash .github/discovery/check-skips.sh test/target/surefire-reports
    secrets:
      features-conf: ${{ secrets.FEATURES_CONF }}
